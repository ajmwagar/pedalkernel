# cargo-about configuration — generates bundled third-party license
# attribution for binary distributions (VST installers, release artifacts).
#
# Run:
#   cargo about generate about.hbs --output-file third_party_licenses.html
#
# The template `about.hbs` lives next to this file.
#
# Any crate whose SPDX expression cannot be satisfied by this allowlist
# fails the run loudly — better than a silent omission in the attribution.
# Keep this list in sync with deny.toml's `[licenses] allow`.

accepted = [
  # Permissive
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  # Weak copyleft
  "MPL-2.0",
  # Ours
  "AGPL-3.0-or-later",
]

# Build targets to resolve Cargo.lock against.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
