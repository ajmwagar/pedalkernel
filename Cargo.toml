[workspace]
resolver = "2"
members = [
    "pedalkernel",
    "pedalkernel-rt",
    "pedalkernel-layout",
    "pedalkernel-validate",
    "pedalkernel-fx-loop",
    "pedalkernel-host-protocol",
    "pedalkernel-editor-surface",
    "pedalkernel-studio-host",
    "xtask",
]

[workspace.dependencies]
fpl-gfx = { version = "0.1.0", git = "https://github.com/ajmwagar/gfx", rev = "7ca43a8b19b8bfb354c4b97f7cbeb82b57d72d08", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
