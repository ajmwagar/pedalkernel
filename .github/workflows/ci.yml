name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Format check
  # ----------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ----------------------------------------------------------------
  # Clippy lint (feature matrix)
  # ----------------------------------------------------------------
  clippy:
    name: clippy (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "no features"
            args: "--no-default-features"
          - label: "tui only"
            args: "--no-default-features --features tui"
          - label: "jack-rt only"
            args: "--no-default-features --features jack-rt"
            jack: true
          - label: "ebers-moll"
            args: "--no-default-features --features ebers-moll"
          - label: "all features"
            args: "--all-features"
            jack: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install libjack-dev
        if: matrix.jack
        run: sudo apt-get update && sudo apt-get install -y libjack-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  # ----------------------------------------------------------------
  # Test (feature matrix)
  # ----------------------------------------------------------------
  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "no features"
            args: "--no-default-features"
          - label: "tui only"
            args: "--no-default-features --features tui"
          - label: "jack-rt only"
            args: "--no-default-features --features jack-rt"
            jack: true
          - label: "ebers-moll"
            args: "--no-default-features --features ebers-moll"
          - label: "all features"
            args: ""
            jack: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libjack-dev
        if: matrix.jack
        run: sudo apt-get update && sudo apt-get install -y libjack-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  # ----------------------------------------------------------------
  # Build examples
  # ----------------------------------------------------------------
  examples:
    name: build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libjack-dev
        run: sudo apt-get update && sudo apt-get install -y libjack-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --examples

  # ----------------------------------------------------------------
  # Benchmarks (informational — never fails the build)
  # ----------------------------------------------------------------
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libjack-dev
        run: sudo apt-get update && sudo apt-get install -y libjack-dev
      - uses: Swatinem/rust-cache@v2

      # Restore baseline from main (if exists)
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ runner.os }}

      # Run benchmarks
      - name: Run benchmarks
        run: cargo bench --bench wdf_bench 2>&1 | tee bench-output.txt

      # Save baseline on main pushes
      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ runner.os }}-${{ github.sha }}

      # Upload results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-output.txt
            target/criterion/

      # Check for regressions (>20% slower = warning in PR comment)
      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          if grep -q "regressed" bench-output.txt; then
            echo "::warning::Benchmark regression detected — check bench-output.txt artifact"
          fi

  # ----------------------------------------------------------------
  # License + supply-chain policy (cargo-deny)
  # ----------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action splices inputs as:
          #   cargo-deny <arguments> <command> <command-arguments>
          # so global flags must live in `arguments` (before the subcommand),
          # and gate names (advisories/bans/licenses/sources) must live in
          # `command-arguments` (after the subcommand). `check` with no
          # positional args runs all four gates by default, so listing them
          # is optional — kept explicit so the job log shows which gate
          # failed without cross-referencing cargo-deny defaults.
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources

  # ----------------------------------------------------------------
  # Third-party attribution smoke test (cargo-about)
  # Ensures the about.hbs template keeps rendering as the tree grows.
  # The resulting HTML is not checked in — downstream binary builds
  # generate it at release time.
  # ----------------------------------------------------------------
  attribution:
    name: cargo-about (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        run: cargo install cargo-about --locked
      - name: Render attribution HTML
        run: cargo about generate about.hbs --output-file third_party_licenses.html
      - name: Upload attribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: third_party_licenses.html
