[package]
name = "pedalkernel-studio-host"
version = "0.1.0"
edition = "2021"
description = "Headless macOS VST3 host controlled by Synesthesia"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
isochrone = { git = "https://github.com/ajmwagar/isochrone", rev = "c12f470208873276f24d1de01c44f8a359d6d330" }
isochrone-core = { git = "https://github.com/ajmwagar/isochrone", rev = "c12f470208873276f24d1de01c44f8a359d6d330" }
pedalkernel-host-protocol = { path = "../pedalkernel-host-protocol" }
serde_json = "1"
vst3-host = { version = "0.9", features = ["midi-input"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }
