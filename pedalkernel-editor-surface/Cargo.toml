[package]
name = "pedalkernel-editor-surface"
version = "0.1.0"
edition = "2021"
description = "Native, retained VST editor frame capture for PedalKernel"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { version = "0.11", default-features = false, features = ["iosurface"] }
block2 = "0.6"
objc2 = "0.6"
objc2-core-media = { version = "0.3.2", default-features = false, features = ["CMSampleBuffer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSError", "NSString"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["composite", "dri3", "extra-traits"] }

[dev-dependencies]
serde_json = "1"
