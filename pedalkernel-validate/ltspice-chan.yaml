global:
  sample_rate: 96000
  oversample: 4
  fft_size: 65536

suites:
  magnetics_external:
    description: "External LTspice CHAN references for PedalKernel J-A transformer behavior"
    tests:
      ja_vs_ltspice_chan_se:
        circuit: "magnetics/ja_vs_ltspice_chan_se.pedal"
        description: "Gapped single-ended J-A output transformer compared loosely to LTspice CHAN"
        signals:
          - type: sine
            frequency: 100.0
            amplitude: 2.0
            duration: 0.1
            label: "sine"
        metrics: []
        pass_criteria:
          normalized_rms_error_db: 12.0
          peak_error_db: 18.0
          thd_error_db: 120.0
