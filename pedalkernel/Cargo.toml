[package]
name = "pedalkernel"
version = "0.1.0"
edition = "2021"
authors = ["Avery Wagar <ajmwagar@gmail.com>"]
description = "Rust WDF kernel for FX pedals — DSL → WDF → audio"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ajmwagar/pedalkernel"
keywords = ["audio", "dsp", "wdf", "guitar", "effects"]
categories = ["multimedia::audio"]
rust-version = "1.75"

[features]
default = ["jack-rt", "tui", "cli", "gummel-poon"]
jack-rt = ["jack"]
tui = ["dep:ratatui", "dep:crossterm"]
cli = ["dep:clap"]
hardware = []
# Advanced BJT model with base charge modulation, junction capacitances
gummel-poon = []
# Use simplified Ebers-Moll BJT model instead of Gummel-Poon.
# Omits Early effect, high-injection, leakage, and parasitic resistances.
# Approximately 3x faster per NR iteration. Suitable for clean amplifier stages.
ebers-moll = []
# Enable detailed signal-level tracing for debugging WDF pipeline.
# Zero-cost when disabled (tracing macros are no-ops without a subscriber).
debug-trace = []
solver-stats = []
# Deliberately injected faults for validating test tolerances.
# Zero-cost when disabled — all hooks are behind #[cfg(feature)].
fault-injection = []
# Runtime warnings for hybrid linear/nonlinear devices (JFET VR, OTA, photocoupler).
# Detects when devices leave their valid linear operating region.
# Zero-cost when disabled — all checks are behind #[cfg(feature)].
runtime-warnings = []
# Tests that reference .pedal files from the private pedalkernel-pro repo.
# Disabled by default so open-source consumers can still run all other tests.
pro-pedals = []

[dependencies]
# DSL parser
nom = "7"

# Audio I/O
jack = { version = "0.11", optional = true }
hound = "3.5"
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Math
num-complex = "0.4"

# Logging
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
rand = "0.8"

[[bench]]
name = "wdf_bench"
harness = false

[[bin]]
name = "pedalkernel"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "process"
