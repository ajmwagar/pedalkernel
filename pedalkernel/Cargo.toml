[package]
name = "pedalkernel"
version = "0.1.0"
edition = "2021"
authors = ["Avery Wagar <ajmwagar@gmail.com>"]
description = "Rust WDF kernel for FX pedals — DSL → WDF → audio"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ajmwagar/pedalkernel"
keywords = ["audio", "dsp", "wdf", "guitar", "effects"]
categories = ["multimedia::audio"]
rust-version = "1.80"

[features]
default = ["std", "jack-rt", "tui", "cli", "gummel-poon", "build-cache"]
std = []
serde = ["pedalkernel-rt/serde"]
# Diagnostics IPC channel: memory-mapped compile-time MNA/scattering snapshot
# (`pedalkernel diag`). Additive; the diagnostics path only runs when the
# subcommand is invoked, so runtime/audio behavior is unchanged.
diag = ["serde", "dep:serde", "dep:serde_json", "dep:memmap2"]
biquad-table = ["pedalkernel-rt/biquad-table"]
jack-rt = ["jack"]
tui = ["dep:ratatui", "dep:crossterm"]
cli = ["dep:clap"]
# Advanced BJT model with base charge modulation, junction capacitances
gummel-poon = []
# Use simplified Ebers-Moll BJT model instead of Gummel-Poon.
# Omits Early effect, high-injection, leakage, and parasitic resistances.
# Approximately 3x faster per NR iteration. Suitable for clean amplifier stages.
ebers-moll = []
# Enable detailed signal-level tracing for debugging WDF pipeline.
# Zero-cost when disabled (tracing macros are no-ops without a subscriber).
debug-trace = []
solver-stats = []
# Deliberately injected faults for validating test tolerances.
# Zero-cost when disabled — all hooks are behind #[cfg(feature)].
fault-injection = []
# Tests that reference .pedal files from the private pedalkernel-pro repo.
# Disabled by default so open-source consumers can still run all other tests.
pro-pedals = []
# Enable compile_pedal_cached() for build.rs consumers.
# Adds postcard serialization so build scripts get a single-call
# compile + cache + serialize utility.
build-cache = ["dep:postcard", "pedalkernel-rt/serde"]
# Pure-buffer audio analysis utilities (rms, peak, thd, spectral_centroid,
# spectral_distance, rms_envelope, assert_healthy, goertzel_power, etc.).
# std-only — off by default so no_std/embedded (Daisy) builds are unaffected.
analysis = ["std"]

[dependencies]
# Runtime crate (WDF engine, elements, tree)
pedalkernel-rt = { path = "../pedalkernel-rt", version = "0.1.0" }

# DSL parser
nom = "7"

# Audio I/O
jack = { version = "0.11", optional = true }
hound = "3.5"
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Math
num-complex = "0.4"

# Serialization (optional, for build-cache feature)
postcard = { version = "1", features = ["alloc"], optional = true }

# Diagnostics IPC (optional, `diag` feature): JSON snapshot + mmap'd IPC file.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }

# Collections
hashbrown = "0.15"

# Logging
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
rand = "0.8"
postcard = { version = "1", features = ["alloc"] }

[[bench]]
name = "wdf_bench"
harness = false

[[bin]]
name = "pedalkernel"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "process"
